name: Attach release files

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and upload release files
    runs-on: windows-latest
    steps:
      - name: Check out the released version
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify deployment archive
        shell: pwsh
        run: ./scripts/rebuild-discloud-zip.ps1

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath discloud-deploy.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  discloud-deploy.zip" | Set-Content -LiteralPath discloud-deploy.zip.sha256 -Encoding ascii

      - name: Upload files to the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload $env:RELEASE_TAG `
            discloud-deploy.zip `
            discloud-deploy.zip.sha256 `
            --clobber
