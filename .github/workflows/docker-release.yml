name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (for example, v0.1.0)"
        required: true
        type: string
      latest:
        description: Also update the latest tag
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag and set image name
        id: image
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Image tag must contain 1-128 letters, digits, underscores, periods, or hyphens, and start with a letter, digit, or underscore."
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Check out the selected revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.tag }}
            ${{ inputs.latest && inputs.tag != 'latest' && format('{0}:latest', steps.image.outputs.name) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
